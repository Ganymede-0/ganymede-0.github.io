<!--
  Ganymede-0 — the orbital system, reduced to a tab icon.

  DESIGNED FOR 16px, not for how it looks in an editor. A favicon is almost
  always rasterised into a 16x16 box, so the mark is built around what survives
  that: a dark plate, one hot core, and a single bright ring crossing it. The
  inner ring and the two bodies are texture that only resolves at 32px and
  above — they are never load-bearing.

  Stroke widths are chosen against that target. This is a 64-unit viewBox, so
  4 units == 1 device pixel at 16px; the rings sit at 3.2 and 2.8 so they stay
  a visible line instead of fading to grey.

  The plate is opaque and dark on purpose. Half the world's browser tab bars are
  light, and a transparent mark in the scene's own dark-on-dark colours would
  vanish against them.

  Palette is the site's own: amber star, violet accent, vacuum plate.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Orbital system">
  <defs>
    <radialGradient id="photosphere" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="38%" stop-color="#ffd694" />
      <stop offset="100%" stop-color="#d98e4a" />
    </radialGradient>

    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb765" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffb765" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffb765" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070d" />

  <!-- The orbital plane, tilted so the system reads three-dimensionally rather
       than as flat concentric circles. The bodies live inside this group, so
       they land exactly on their rings with no trigonometry. -->
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="9.6" fill="none"
             stroke="#8b7cff" stroke-opacity="0.9" stroke-width="3.2" />
    <ellipse cx="32" cy="32" rx="16" ry="6.2" fill="none"
             stroke="#d98e4a" stroke-opacity="0.85" stroke-width="2.8" />

    <circle cx="57" cy="32" r="4.2" fill="#8b7cff" />
    <circle cx="16" cy="32" r="3" fill="#e4572e" />
  </g>

  <!-- Star last, so it sits over the rings exactly as it does in the scene. -->
  <circle cx="32" cy="32" r="17" fill="url(#corona)" />
  <circle cx="32" cy="32" r="8.6" fill="url(#photosphere)" />
</svg>
