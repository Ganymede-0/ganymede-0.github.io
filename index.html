<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the scene run edge-to-edge behind a notch /
         rounded corners; the UI is then inset with env(safe-area-inset-*) so no
         control ever lands under the hardware. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Sarah Altheeb — Applied AI engineer. An orbital system of deep-tech engineering pipelines: 3D medical imaging, time-series forecasting, and applied analytics."
    />
    <title>Sarah Altheeb · Applied AI Engineer</title>

    <!-- LINK PREVIEWS — what WhatsApp, LinkedIn, Slack and iMessage show when
         this address is pasted.
         =====================================================================
         WHY A COMMITTED IMAGE AND NOT THE LIVE PAGE
         None of these crawlers run JavaScript. They fetch the HTML, read the
         tags below, and stop — which for a site whose entire content is drawn
         by WebGL means that without a real image file they have literally
         nothing to show. media/social/preview.jpg is a capture of this scene at
         card size, so the preview is the actual product rather than a logo.

         THE CONSTRAINTS THIS FILE IS BUILT TO
         - Absolute https URLs. A relative og:image is silently dropped by every
           one of these crawlers; this is the single most common reason a
           preview comes back as a bare grey link.
         - 1200x630 at 2x = 2400x1260. That is the 1.91:1 frame every platform
           crops its card from, so nothing important lands outside it.
         - 250 KB. WhatsApp gives up on images much past a few hundred KB and
           falls back to text, which is why this is a JPEG at quality 82 rather
           than the PNG it was captured as (2.8 MB).
         - JPEG, not WebP. LinkedIn and several WhatsApp builds still will not
           render a WebP card.

         AFTER CHANGING THE IMAGE: both LinkedIn and WhatsApp cache a card for
         days. LinkedIn's Post Inspector re-fetches on demand; WhatsApp is most
         easily refreshed by appending ?v=2 to the shared link. -->
    <link rel="canonical" href="https://ganymede-0.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sarah Altheeb" />
    <meta property="og:url" content="https://ganymede-0.github.io/" />
    <meta property="og:title" content="Sarah Altheeb · Applied AI Engineer" />
    <meta
      property="og:description"
      content="An orbital system of applied AI work — 3D medical imaging, predictive maintenance, and market analytics. Explore the projects, or open the full CV."
    />
    <meta
      property="og:image"
      content="https://ganymede-0.github.io/media/social/preview.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://ganymede-0.github.io/media/social/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="A star with four bodies in orbit around it, labelled Raha, Bayan, Sharqiyah and Experience, under the name Sarah Altheeb."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sarah Altheeb · Applied AI Engineer" />
    <meta
      name="twitter:description"
      content="An orbital system of applied AI work — 3D medical imaging, predictive maintenance, and market analytics. Explore the projects, or open the full CV."
    />
    <meta
      name="twitter:image"
      content="https://ganymede-0.github.io/media/social/preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="A star with four bodies in orbit around it, under the name Sarah Altheeb."
    />

    <!-- TYPE — three faces, each with exactly one job.

         Oxanium (SIL OFL, variable 200-800) is the interface: the name, every
         label, every button. Outfit (variable 100-900) is the reading face for
         prose in the CV and the project panels — a squared-off face is right
         for a label and wrong for six lines of a case study. Geist Mono is the
         instrument register only (.mono): mission codes, coordinates and metric
         readouts that have to align in columns.

         SUBSTITUTION NOTE — "Rexlia" was requested for the interface. Its free
         download is a Typodermic DESKTOP licence, and their own guide places
         "any use that serves or embeds the font in a website" outside it, so it
         cannot ship here. Oxanium stands in: the same squared-off, technical
         geometry, and it goes thin enough to keep the interface light rather
         than heavy. To switch to Rexlia once a webfont licence is bought,
         self-host its woff2 and change the stacks at the top of tokens.css —
         nothing else in the codebase names a typeface.

         THERE IS NO TYPE IN THE 3D SCENE AT ALL. The star used to carry a sign
         reading "Start Here", which went through two source faces and a
         build-time rasteriser to avoid ever serving a licensed font. It is now
         three chevrons pointing at the star (see SunCue.jsx) — a mark, not a
         word — so the whole question is gone, along with the serif this file
         used to request for it: a font download every visitor paid for and
         none of them ever saw. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Outfit:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
