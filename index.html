<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the scene run edge-to-edge behind a notch /
         rounded corners; the UI is then inset with env(safe-area-inset-*) so no
         control ever lands under the hardware. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Sarah Altheeb — Applied AI engineer. An orbital system of deep-tech engineering pipelines: 3D medical imaging, time-series forecasting, and applied analytics."
    />
    <title>Sarah Altheeb · Applied AI Engineer</title>

    <!-- TYPE — three faces, each with exactly one job.

         Oxanium (SIL OFL, variable 200-800) is the interface: the name, every
         label, every button. Outfit (variable 100-900) is the reading face for
         prose in the CV and the project panels — a squared-off face is right
         for a label and wrong for six lines of a case study. Geist Mono is the
         instrument register only (.mono): mission codes, coordinates and metric
         readouts that have to align in columns.

         SUBSTITUTION NOTE — "Rexlia" was requested for the interface. Its free
         download is a Typodermic DESKTOP licence, and their own guide places
         "any use that serves or embeds the font in a website" outside it, so it
         cannot ship here. Oxanium stands in: the same squared-off, technical
         geometry, and it goes thin enough to keep the interface light rather
         than heavy. To switch to Rexlia once a webfont licence is bought,
         self-host its woff2 and change the stacks at the top of tokens.css —
         nothing else in the codebase names a typeface.

         The 3D title is NOT a webfont. It is Rukyltronic, rasterised to flat
         artwork on a developer machine by scripts/build-title.mjs; the licence
         covers that and would not cover serving the font. Nothing about the
         title is downloaded as type, which is also why the serif this file used
         to request is gone: it was the old title's source face and had no other
         user, so it was a font download every visitor paid for and none of them
         ever saw. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Outfit:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
