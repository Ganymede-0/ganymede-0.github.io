<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the scene run edge-to-edge behind a notch /
         rounded corners; the UI is then inset with env(safe-area-inset-*) so no
         control ever lands under the hardware. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Sarah Altheeb — Applied AI engineer. An orbital system of deep-tech engineering pipelines: 3D medical imaging, time-series forecasting, and applied analytics."
    />
    <title>Sarah Altheeb · Applied AI Engineer</title>

    <!-- Sora — variable, 100–800, used globally. A single variable axis means
         one file covers every weight in the hierarchy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
